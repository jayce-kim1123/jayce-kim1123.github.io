title: "기술 블로그로 하겠습니다. 근데 이제 AX를 곁들인"
description: 개발 회고와 작업 기록
lang: ko_KR
timezone: Asia/Seoul

plugins:
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
